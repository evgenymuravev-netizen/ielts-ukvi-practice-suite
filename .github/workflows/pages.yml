name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Every script parses
        run: for f in assets/*.js data/*.js data/*/*.js; do node --check "$f"; done
      - name: Test data is structurally sound
        run: node tools/check-data.js
      - name: The app code is actually committed
        run: |
          for f in assets/app.css assets/core.js assets/render.js assets/writing-check.js assets/app.js; do
            git ls-files --error-unmatch "$f" >/dev/null \
              || { echo "::error::$f is missing from git — check .gitignore"; exit 1; }
          done
      - name: Single-file builds are up to date
        run: |
          python3 build-single-file.py
          git diff --exit-code -- ielts-ukvi-practice-suite.html ielts-ukvi-sample-test.html \
            || { echo "::error::Built files are stale — run python3 build-single-file.py and commit"; exit 1; }

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
